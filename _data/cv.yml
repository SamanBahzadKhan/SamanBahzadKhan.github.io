        start_date: 2024
        end_date: 2025
        summary: Published at ACL 2026
        highlights:
          - Developed a weighted Direct Preference Optimization approach that reduces semantic drift during automated prompt optimization and established a theoretical bound on drift in preference-tuned prompt generators.
          - "Improved CLIP similarity by 8–12% and human-preference scores by 5–9% over standard DPO across three benchmarks and three language-model backbones; preferred in 82.2% of pairwise human evaluations."

      - position: "LADs: Leveraging LLMs for AI-Driven DevOps"
        url: /projects/lads/
        company: "Advisors: Dr. Ali Anwar, University of Minnesota · Dr. Ali R. Butt, Virginia Tech"
        start_date: 2025
        end_date: 2026
        summary: First author. Submission at MLSys 2027
        highlights:
          - "Co-developed a six-agent framework for configuration, deployment, monitoring, and automated repair; achieved 68% deployment success across 180 Dask, Redis, and Ray tasks and repaired 94% of runtime failures within three iterations."
          - Adapted two existing systems as baselines and substantially redesigned the evaluation and technical presentation to better establish LADs' gains over prior approaches.

      - position: "SkillGraph: Reusable Reasoning Skills from LLM Agent Traces"
        url: /projects/skillgraph/
        company: "Advisors: Dr. Tianyin Xu, University of Illinois Urbana-Champaign · Dr. Ali Anwar, University of Minnesota"
        start_date: 2026
        end_date: present
        summary: First author. Submission at MLSys 2027
        highlights:
          - "Leading development of a GraphRAG-based skill graph for extracting and reusing diagnostic reasoning from agent trajectories; built a database of reasoning traces for skill extraction and retrieval on new system incidents."
          - Identified shortcut behavior that corrupts learned skills and designed a process-level critic that evaluates reasoning quality rather than final outcomes alone.

